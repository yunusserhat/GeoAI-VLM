name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Core + search only. The VLM and Vision2Slope extras pull torch/vllm and
      # are not needed to verify data-layer behaviour; tests that would require
      # a real model or a network call are excluded by design.
      - name: Install package (core + search extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[search,dev]'

      - name: Assert the core imports without the heavy vision stack
        run: |
          python - <<'PY'
          import importlib.util
          for mod in ("cv2", "torch", "transformers", "zensvi", "skimage", "vllm"):
              assert importlib.util.find_spec(mod) is None, f"{mod} unexpectedly installed"
          import geoai_vlm
          from geoai_vlm import describe_place, build_embedding_text
          print("core import OK:", geoai_vlm.__version__)
          PY

      - name: Run CPU test suite
        run: python -m pytest tests/ -q --maxfail=0

  api-contract:
    name: Example API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[search,dev]'

      # Guards the signatures the README and the example notebooks call, so a
      # documented call cannot silently drift away from the implementation.
      - name: Check documented signatures
        run: python -m pytest tests/test_api_contract.py -q
